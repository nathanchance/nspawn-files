resolver 1.1.1.1 8.8.8.8 8.8.4.4 0.250.250.200 ipv6=off;

server {
    listen      50001;
    listen      [::]:50001;
    server_name _;
    root        /srv/mirror/http/pacman-cache;
    autoindex   on;

    location ~ \.(db|sig|files)$ {
        proxy_pass http://mirrors$request_uri;
    }

    location ~ \.tar\.(xz|zst)$ {
        try_files $uri @pkg_mirror;
    }

    location @pkg_mirror {
        proxy_store    on;
        proxy_redirect off;
        proxy_store_access  user:rw group:rw all:r;
        proxy_next_upstream error timeout http_404;
        proxy_pass          http://mirrors$request_uri;
    }
}

upstream mirrors {
    server 127.0.0.1:50100;
    server 127.0.0.1:50101 backup;
    server 127.0.0.1:50102 backup;
    server 127.0.0.1:50103 backup;
}

server {
    listen      127.0.0.1:50100;

    location / {
        proxy_pass       http://arch.mirror.constant.com$request_uri;
    }
}

server {
    listen      127.0.0.1:50101;

    location / {
        proxy_pass       http://us.mirrors.cicku.me/archlinux$request_uri;
    }
}

server {
    listen      127.0.0.1:50102;

    location / {
        proxy_pass       http://iad.mirrors.misaka.one/archlinux$request_uri;
    }
}

server {
    listen      127.0.0.1:50103;

    location / {
        proxy_pass       http://mirrors.rit.edu/archlinux$request_uri;
    }
}
